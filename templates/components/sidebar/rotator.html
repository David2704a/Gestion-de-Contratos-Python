<div class="sidebar-rotator">
    <div class="rotator-controls">
        <button class="rotator-prev"><i class="fas fa-chevron-left"></i></button>
        <span class="rotator-indicator"></span>
        <button class="rotator-next"><i class="fas fa-chevron-right"></i></button>
    </div>
    <!-- Panel de Estadísticas -->
    <div class="rotator-panel active" data-panel="stats">
        {% include "components/contract_stats.html" %}
    </div>

    <!-- Panel de Calendario -->
    <div class="rotator-panel" data-panel="calendar">
        {% include "components/contract_calendar.html" %}
    </div>

    <!-- Panel de Actividad (opcional) -->
    <div class="rotator-panel" data-panel="activity">
        {% include "components/recent_activity.html" %}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const rotator = document.querySelector('.sidebar-rotator');
        const panels = rotator.querySelectorAll('.rotator-panel');
        const controls = {
            prev: document.querySelector('.rotator-prev'),
            next: document.querySelector('.rotator-next'),
            indicator: document.querySelector('.rotator-indicator')
        };

        let currentIndex = 0;
        let rotationInterval;
        const rotationSpeed = 10000; 

        function showPanel(index) {
            panels.forEach((panel, i) => {
                panel.classList.toggle('active', i === index);
            });
            updateIndicator();
        }

        function startRotation() {
            rotationInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % panels.length;
                showPanel(currentIndex);
            }, rotationSpeed);
        }

        if (controls.next && controls.prev) {
            controls.next.addEventListener('click', () => {
                clearInterval(rotationInterval);
                currentIndex = (currentIndex + 1) % panels.length;
                showPanel(currentIndex);
                startRotation();
            });

            controls.prev.addEventListener('click', () => {
                clearInterval(rotationInterval);
                currentIndex = (currentIndex - 1 + panels.length) % panels.length;
                showPanel(currentIndex);
                startRotation();
            });
        }

        function updateIndicator() {
            if (controls.indicator) {
                controls.indicator.textContent = `${currentIndex + 1}/${panels.length}`;
            }
        }

        showPanel(0);
        startRotation();

        rotator.addEventListener('mouseenter', () => clearInterval(rotationInterval));
        rotator.addEventListener('mouseleave', startRotation);
    });
</script>


<style>
    .sidebar-rotator {
        position: relative;
        height: 100%;
        overflow: hidden;
    }

    .rotator-panel {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 0.5s ease, transform 0.5s ease;
        transform: translateX(20px);
        pointer-events: none;
    }

    .rotator-panel.active {
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
    }

    .rotator-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin-top: 15px;
    }

    .rotator-controls button {
        background: #8bb8ff;
        border: none;
        color: white;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        transition: background 0.3s;
    }

    .rotator-controls button:hover {
        background: #7aa8f0;
    }

    .rotator-indicator {
        font-size: 12px;
        color: #5a6d80;
    }
</style>
