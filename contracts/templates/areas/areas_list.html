{% extends 'plantilla.html' %}
{% load static %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="{% static 'css/datatable.css' %}">
<link rel="stylesheet" href="{% static 'css/areas/areas_list.css' %}">
<link rel="stylesheet" href="{% static 'css/areas/area_create.css' %}">
<script src="{% static 'js/alertSwitch.js' %}"></script>
<script src="{% static 'js/areas/areas_list.js' %}"></script>

<div class="areas-container">
    <div class="areas-header">
        <h2>Lista de Cláusulas</h2>
        <button type="button" id="createAreaBtn" class="add-area-btn" data-bs-toggle="modal"
            data-bs-target="#createAreaModal" data-url="{% url 'create_area' %}">
            <i class="fas fa-plus-circle"></i> Agregar Área
        </button>
    </div>

    <div class="areas-table-container">
        <table class="areas-table" id="areas_table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for area in areas %}
                <tr>
                    <td>
                        {{ forloop.counter }}
                    </td>
                    <td>
                        {{ area.name_area }}
                    </td>
                    <td>
                        {{ area.created_at }}
                    </td>
                    <td>
                        <div class="area-actions">
                            <a href="#" class="edit-area-btn" data-id="{{area.id}}" data-name="{{area.name_area}}"
                                data-url="{% url 'update_area' area.id %}" title="Editar">
                                <i class="fa fa-edit"></i>
                            </a>

                            <button type="button" class="delete-area-btn"
                                data-url="{% url 'delete_area' area.id %}" title="Eliminar">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="createAreaModal" tabindex="-1" aria-labelledby="createAreaModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createAreaModalLabel">Crear Área</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="POST" id="createAreaForm" class="create-area-form"
                    data-url="{% url 'create_area' %}">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="name"><i class="fas fa-id-card"></i> Nombre del área</label>
                        <input type="text" id="name_area" name="name_area" required>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" id="submitAreaForm" class="submit-btn">Guardar Área</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
{% endblock %}
