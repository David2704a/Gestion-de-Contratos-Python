{% extends 'plantilla.html' %}
{% load static %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="{% static 'css/datatable.css' %}">
<link rel="stylesheet" href="{% static 'css/type_contracts/typeContract_list.css' %}">
<link rel="stylesheet" href="{% static 'css/type_contracts/typeContract_create.css' %}">
<script src="{% static 'js/alertSwitch.js' %}"></script>
<script src="{% static 'js/type_contracts/typeContracts_list.js' %}"></script>

<div class="typeContracts-container">
    <div class="typeContracts-header">
        <h2>Lista de Tipos de Contrato</h2>
        <button type="button" id="createTypeCBtn" class="add-typeC-btn" data-bs-toggle="modal"
            data-bs-target="#createTypeCModal" data-url="{% url 'create_type_contract' %}">
            <i class="fas fa-plus-circle"></i> Agregar Tipo de Contrato
        </button>
    </div>

    <div class="typeContracts-table-container">
        <table class="typeContracts-table" id="typeContracts_table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tipo</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for typeC in typeContracts %}
                <tr>
                    <td>
                        {{ forloop.counter }}
                    </td>
                    <td>
                        {{ typeC.type_contract }}
                    </td>
                    <td>
                        {{ typeC.created_at }}
                    </td>
                    <td>
                        <div class="typeC-actions">
                            <a href="#" class="edit-typeC-btn" data-id="{{typeC.id}}" data-name="{{typeC.type_contract}}"
                                data-url="{% url 'update_type_contract' typeC.id %}" title="Editar">
                                <i class="fa fa-edit"></i>
                            </a>

                            <button type="button" class="delete-typeC-btn"
                                data-url="{% url 'delete_type_contract' typeC.id %}" title="Eliminar">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="createTypeCModal" tabindex="-1" aria-labelledby="createTypeCModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createTypeCModalLabel">Crear Tipo de Contrato</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="POST" id="createTypeCForm" class="create-typeC-form"
                    data-url="{% url 'create_type_contract' %}">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="name"><i class="fas fa-id-card"></i> Nombre del Tipo Contrato</label>
                        <input type="text" id="type_contract" name="type_contract" required>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" id="submitTypeCForm" class="submit-btn">Guardar Tipo de Contrato</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
{% endblock %}
