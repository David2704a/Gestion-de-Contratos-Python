<div class="contract-dashboard">
    <!-- Sidebar Izquierdo - Estadísticas -->
  

    <!-- Contenido Central - Formulario -->
    <main class="form-container">
        <div class="user-create-body">
            <div class="user-create-container">
                <div class="user-create-header">
                    <h2>Creación de Nuevo Usuario</h2>
                </div>

                <form method="POST" class="user-create-form">
                    {% csrf_token %}

                    <!-- Sección 1: Credenciales -->
                    <div class="form-section">
                        <label>Nombre de Usuario</label>
                        <input type="text" name="username" class="form-input" required>
                    </div>

                    <div class="form-section">
                        <label>Correo Electrónico</label>
                        <input type="email" name="email" class="form-input" required>
                    </div>

                    <div class="form-section">
                        <label>Contraseña</label>
                        <input type="password" name="password" class="form-input" required>
                    </div>

                    <!-- Sección 2: Información Personal -->
                    <div class="form-section">
                        <label>Nombre</label>
                        <input type="text" name="first_name" class="form-input" required>
                    </div>

                    <div class="form-section">
                        <label>Apellido</label>
                        <input type="text" name="last_name" class="form-input" required>
                    </div>

                    <div class="form-section">
                        <label>Teléfono</label>
                        <input type="text" name="phone_number" class="form-input" required>
                    </div>

                    <!-- Sección 3: Documentación -->
                    <div class="form-section">
                        <label>Número de Identificación</label>
                        <input type="text" name="identification_number" class="form-input" required>
                    </div>

                    <div class="form-section">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" name="birth_date" class="form-input" required>
                    </div>

                    <div class="form-section">
                        <label>Tipo de Identificación</label>
                        <select name="type_identification_id" class="form-input form-select" required>
                            {% for id_type in identifications %}
                            <option value="{{ id_type.id }}">{{ id_type.description }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Sección 4: Organización -->
                    <div class="form-section span-2">
                        <label>Organización</label>
                        <select name="organization_id" class="form-input form-select" required>
                            {% for org in organizations %}
                            <option value="{{ org.id }}">{{ org.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Sección 5: Dirección -->
                    <div class="form-section span-3">
                        <label>Dirección</label>
                        <textarea name="address" class="form-input form-textarea" required></textarea>
                    </div>

                    <!-- Botón de envío -->
                    <div class="submit-section">
                        <button type="submit" class="submit-button">Registrar Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Sidebar Derecho - Calendario -->
    {% include "components/sidebar/rotator.html" %}
</div>

<style>
    .contract-dashboard {
        display: grid;
        grid-template-columns:
            minmax(200px, 280px)
            minmax(400px, 1fr)
            minmax(180px, 260px);
        gap: 15px;
        max-width: 1400px;
        margin: 0 auto;
        transition: all 0.3s ease;
    }

    @media (max-width: 1600px) {
        .contract-dashboard {
            grid-template-columns:
                minmax(180px, 220px) minmax(350px, 1fr) minmax(150px, 200px);
        }

        .stat-card {
            padding: 10px !important;
        }

        .stat-value {
            font-size: 20px !important;
        }

        .day-number {
            font-size: 24px !important;
        }

        .form-section {
            margin-bottom: 10px !important;
        }
    }

    @media (max-width: 1200px) {
        .contract-dashboard {
            grid-template-columns:
                minmax(150px, 180px) minmax(300px, 1fr) minmax(120px, 160px);
            gap: 10px;
        }

        .form-input,
        .form-select {
            padding: 8px 10px !important;
            font-size: 13px !important;
        }

        .stat-label,
        .day-name {
            font-size: 10px !important;
        }
    }

    @media (max-width: 768px) {
        .contract-dashboard {
            grid-template-columns: 1fr;
        }
    }

    .hide-on-compact {
        display: block;
    }

    @media (max-width: 1200px) {
        .hide-on-compact {
            display: none;
        }
    }

    .user-create-body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fa;
        margin: 0;
        padding: 30px;
        color: #333;
    }

    .user-create-container {
        max-width: 1200px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .user-create-header {
        text-align: center;
        margin-bottom: 30px;
        color: #5a6d80;
    }

    .user-create-form {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .form-section {
        margin-bottom: 15px;
    }

    .form-section label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #5a6d80;
        font-size: 14px;
    }

    .form-input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #d1d9e6;
        border-radius: 8px;
        font-size: 14px;
        background-color: #f8fafc;
        transition: all 0.3s ease;
    }

    .form-input:focus {
        outline: none;
        border-color: #a8c5ff;
        box-shadow: 0 0 0 3px rgba(168, 197, 255, 0.2);
    }

    .form-select {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235a6d80' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 15px center;
        background-size: 15px;
    }

    .form-textarea {
        min-height: 100px;
        resize: vertical;
    }

    .span-2 {
        grid-column: span 2;
    }

    .span-3 {
        grid-column: span 3;
    }

    .submit-section {
        grid-column: span 3;
        text-align: center;
        margin-top: 20px;
    }

    .submit-button {
        background-color: #8bb8ff;
        color: white;
        border: none;
        padding: 14px 40px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.3s ease;
    }

    .submit-button:hover {
        background-color: #7aa8f0;
    }

    /* Responsive */
    @media (max-width: 900px) {
        .user-create-form {
            grid-template-columns: repeat(2, 1fr);
        }

        .span-2,
        .span-3 {
            grid-column: span 2;
        }
    }

    @media (max-width: 600px) {
        .user-create-form {
            grid-template-columns: 1fr;
        }

        .span-2,
        .span-3 {
            grid-column: span 1;
        }
    }

    .contract-dashboard {
        display: grid;
        grid-template-columns: 280px 1fr 260px;
        gap: 25px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .contract-stats-sidebar {
        margin: 4em 0.5em;
        background: linear-gradient(135deg, #a8d1fa 0%, #e6f0ff 100%);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .stats-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        color: #4a6baf;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 25px;
    }

    .stat-card {
        padding: 15px;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
    }

    .stat-card.highlight {
        box-shadow: 0 0 0 2px #ff6b6b;
    }

    .stat-value {
        font-size: 24px;
        font-weight: 700;
        color: #2c3e50;
    }

    .stat-label {
        font-size: 12px;
        color: #5a6d80;
        margin-top: 5px;
    }

    .stat-icon {
        position: absolute;
        right: 15px;
        bottom: 15px;
        font-size: 20px;
        opacity: 0.3;
    }

    .calendar-sidebar {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .calendar-header {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
    }

    .calendar-day {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px;
        background: #f8fafc;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    .day-number {
        font-size: 32px;
        font-weight: 700;
        color: #4a6baf;
        min-width: 40px;
        text-align: center;
    }

    .day-name {
        font-size: 12px;
        color: #5a6d80;
        text-transform: uppercase;
    }

    .contract-count {
        font-size: 11px;
        color: #8bb8ff;
        font-weight: 600;
    }

    .contract-item {
        display: flex;
        align-items: center;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 8px;
        background: white;
        border: 1px solid #eee;
    }

    .contract-item.urgent {
        border-left: 3px solid #ff6b6b;
    }

    /* Responsive */
    @media (max-width: 1200px) {
        .contract-dashboard {
            grid-template-columns: 1fr;
        }

        .contract-stats-sidebar,
        .calendar-sidebar {
            order: -1;
            margin-bottom: 30px;
        }
    }
</style>
{% endblock %}
