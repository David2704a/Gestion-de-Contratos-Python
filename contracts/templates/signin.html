<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Vibrante</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="logo-circle">
                    <i class="fas fa-user-astronaut"></i>
                </div>
                <h1>Welcome Back!</h1>
                <p>Sign in to your account</p>
            </div>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form action="/signin/" method="POST" class="login-form">
                {% csrf_token %}

                <div class="form-group floating-input">
                    <input type="text" id="username" name="username" required>
                    <label for="username"><i class="far fa-user"></i> Username</label>
                    <span class="highlight"></span>
                </div>

                <div class="form-group floating-input">
                    <input type="password" id="password" name="password" required>
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <span class="highlight"></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="login-button">
                    <span>Sign In</span>
                    <div class="button-liquid"></div>
                </button>
            </form>

            
        </div>
    </div>

    <style>
        :root {
            --primary: #8bb8e8;
            --primary-light: #c1dbf5;
            --primary-dark: #6a9fd1;
            --secondary: #ffb6c1;
            --text: #5a7a9a;
            --text-light: #9ab3c9;
            --white: #ffffff;
            --error: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e6f0ff 0%, #f0f9ff 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(168, 197, 224, 0.15);
            backdrop-filter: blur(5px);
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            animation: float 15s infinite ease-in-out;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
            animation: float 12s infinite ease-in-out reverse;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            top: 40%;
            right: 20%;
            animation: float 10s infinite ease-in-out 2s;
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(149, 202, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: all 0.5s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(149, 202, 255, 0.35);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 32px;
            box-shadow: 0 10px 20px rgba(139, 184, 232, 0.3);
            transition: all 0.3s ease;
        }

        .logo-circle:hover {
            transform: rotate(15deg) scale(1.1);
        }

        .login-header h1 {
            color: var(--primary-dark);
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .floating-input {
            position: relative;
            margin-bottom: 15px;
        }

        .floating-input input {
            width: 100%;
            padding: 15px 20px 15px 45px;
            border: 2px solid #e0edfd;
            border-radius: 12px;
            font-size: 15px;
            background-color: #f9fcff;
            color: var(--text);
            transition: all 0.3s ease;
            z-index: 1;
            position: relative;
        }

        .floating-input input:focus {
            outline: none;
            border-color: var(--primary-light);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(139, 184, 232, 0.2);
        }

        .floating-input label {
            position: absolute;
            left: 45px;
            top: 15px;
            color: var(--text-light);
            font-size: 15px;
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2;
        }

        .floating-input label i {
            font-size: 14px;
        }

        .floating-input input:focus + label,
        .floating-input input:not(:placeholder-shown) + label {
            transform: translate(-25px, -22px) scale(0.85);
            background-color: var(--white);
            padding: 0 10px;
            color: var(--primary-dark);
        }

        .highlight {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            transition: all 0.4s ease;
            border-radius: 2px;
        }

        .floating-input input:focus ~ .highlight {
            width: 100%;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--text-light);
            font-size: 14px;
        }

        .remember-me input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkmark {
            height: 18px;
            width: 18px;
            background-color: #f9fcff;
            border: 2px solid #d4e3f0;
            border-radius: 4px;
            margin-right: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .remember-me:hover input ~ .checkmark {
            border-color: var(--primary-light);
        }

        .remember-me input:checked ~ .checkmark {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 5px;
            top: 1px;
            width: 4px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .remember-me input:checked ~ .checkmark:after {
            display: block;
        }

        .forgot-password {
            color: var(--text-light);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .login-button {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(139, 184, 232, 0.4);
            z-index: 1;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 184, 232, 0.6);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .button-liquid {
            position: absolute;
            top: -80px;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to right, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.3) 100%);
            transform: rotate(20deg);
            transition: all 0.7s ease;
            z-index: -1;
            opacity: 0;
        }

        .login-button:hover .button-liquid {
            opacity: 1;
            top: -120px;
        }

        .social-login {
            margin: 30px 0;
            text-align: center;
        }

        .social-login p {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 15px;
            position: relative;
        }

        .social-login p:before,
        .social-login p:after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4e3f0);
        }

        .social-login p:before {
            left: 0;
        }

        .social-login p:after {
            right: 0;
            background: linear-gradient(90deg, #d4e3f0, transparent);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .social-icon:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .social-icon.google {
            background: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 100%);
        }

        .social-icon.facebook {
            background: linear-gradient(135deg, #A1C4FD 0%, #C2E9FB 100%);
        }

        .social-icon.twitter {
            background: linear-gradient(135deg, #84FAB0 0%, #8FD3F4 100%);
        }

        .signup-link {
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
        }

        .signup-link a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--error);
            background-color: #fff0f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            border: 1px solid #ffd6d6;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            20%, 60% {
                transform: translateX(-5px);
            }
            40%, 80% {
                transform: translateX(5px);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .floating-input input {
                padding: 12px 15px 12px 40px;
            }
            
            .login-header h1 {
                font-size: 24px;
            }
            
            .logo-circle {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }
        }
    </style>
</body>

</html>
