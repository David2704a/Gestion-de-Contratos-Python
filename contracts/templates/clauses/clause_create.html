{% extends 'plantilla.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/clauses/clause_create.css' %}">

<div class="create-clause-container">
    <div class="create-clause-header">
        <h2>Crear Nueva Cláusula</h2>
        <a href="#" class="back-btn">← Volver</a>
    </div>

    <form method="POST" class="create-clause-form">
        {% csrf_token %}

        <div class="form-group span-2">
            <label>Organización</label>
            <select name="organization_id" class="form-input form-select" required>
                <option value="">Seleccione una opción</option>
                {% for org in organizations %}
                <option value="{{ org.id }}">{{ org.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Nombre -->
        <div class="form-group">
            <label for="nombre">Nombre de la cláusula</label>
            <input type="text" id="nombre" name="title" required>
        </div>



        <!-- Descripción -->
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="description" rows="4" required></textarea>
        </div>

        <!-- Botón -->
        <div class="form-actions">
            <button type="submit" class="submit-btn">Guardar Cláusula</button>
        </div>
    </form>
</div>

{% endblock %}
